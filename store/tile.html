<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a14; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #eee; }
.tile {
  width: 880px;
  height: 560px;
  padding: 44px 48px;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
/* Background decorations */
.tile::before {
  content: '';
  position: absolute;
  top: -120px;
  right: -80px;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(102,126,234,0.10) 0%, transparent 65%);
  border-radius: 50%;
}
.tile::after {
  content: '';
  position: absolute;
  bottom: -100px;
  left: -60px;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(118,75,162,0.08) 0%, transparent 65%);
  border-radius: 50%;
}

/* Top section: icon + title */
.header {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 14px;
}
.tile-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 800;
  color: #fff;
  flex-shrink: 0;
}
.header-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.tile-title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, #fff 30%, #a78bfa 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.tile-subtitle {
  font-size: 12px;
  color: #777;
}

/* Middle: Mock UI card */
.mock-ui {
  position: relative;
  z-index: 1;
  background: rgba(20, 20, 42, 0.85);
  border: 1px solid rgba(100,100,180,0.15);
  border-radius: 14px;
  padding: 22px 26px;
  backdrop-filter: blur(10px);
}
.mock-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.mock-dot {
  width: 8px; height: 8px; border-radius: 50%;
}
.mock-dot.r { background: #ff5f57; }
.mock-dot.y { background: #febc2e; }
.mock-dot.g { background: #28c840; }
.mock-url {
  flex: 1;
  background: rgba(40,40,70,0.6);
  border-radius: 6px;
  padding: 5px 12px;
  font-size: 10px;
  color: #666;
  margin-left: 6px;
}
.mock-body {
  display: flex;
  gap: 18px;
  align-items: stretch;
}
.mock-article {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.mock-line {
  height: 6px;
  border-radius: 3px;
  background: rgba(60,60,100,0.35);
}
.mock-line.w60 { width: 60%; }
.mock-line.w80 { width: 80%; }
.mock-line.w45 { width: 45%; }
.mock-line.w70 { width: 70%; }
.mock-line.w55 { width: 55%; }
.mock-line.w90 { width: 90%; }

.mock-summary {
  width: 240px;
  flex-shrink: 0;
  background: rgba(102,126,234,0.08);
  border: 1px solid rgba(102,126,234,0.18);
  border-radius: 10px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.summary-header {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 700;
  color: #a78bfa;
}
.summary-icon {
  width: 16px; height: 16px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  color: #fff;
}
.summary-line {
  font-size: 9px;
  color: #bbb;
  line-height: 1.5;
  padding-left: 4px;
  border-left: 2px solid rgba(102,126,234,0.3);
}
.summary-tag-row {
  display: flex;
  gap: 5px;
  margin-top: 2px;
}
.summary-mini-tag {
  font-size: 8px;
  padding: 2px 7px;
  border-radius: 4px;
  background: rgba(102,126,234,0.12);
  color: #8b8bcc;
}

/* Bottom: features */
.features {
  position: relative;
  z-index: 1;
  display: flex;
  gap: 10px;
}
.feature-tag {
  padding: 7px 14px;
  background: rgba(30,30,55,0.7);
  border: 1px solid rgba(100,100,160,0.15);
  border-radius: 8px;
  font-size: 11px;
  color: #aaa;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}
.feature-tag .tag-icon {
  font-size: 13px;
}
</style>
</head>
<body>
<div class="tile">
  <!-- Header -->
  <div class="header">
    <div class="tile-icon">⚡</div>
    <div class="header-text">
      <div class="tile-title">闪读 — AI 网页摘要</div>
      <div class="tile-subtitle">一键总结，3秒获取核心观点</div>
    </div>
  </div>

  <!-- Mock UI -->
  <div class="mock-ui">
    <div class="mock-toolbar">
      <div class="mock-dot r"></div>
      <div class="mock-dot y"></div>
      <div class="mock-dot g"></div>
      <div class="mock-url">https://example.com/article/2024/...</div>
    </div>
    <div class="mock-body">
      <div class="mock-article">
        <div class="mock-line w60"></div>
        <div class="mock-line w90"></div>
        <div class="mock-line w80"></div>
        <div class="mock-line w45"></div>
        <div class="mock-line w70"></div>
        <div class="mock-line w90"></div>
        <div class="mock-line w55"></div>
        <div class="mock-line w80"></div>
        <div class="mock-line w60"></div>
      </div>
      <div class="mock-summary">
        <div class="summary-header">
          <div class="summary-icon">⚡</div>
          AI 摘要
        </div>
        <div class="summary-line">核心观点：AI 技术正深刻改变信息获取方式...</div>
        <div class="summary-line">关键数据：市场规模增长 47%，用户突破 2 亿</div>
        <div class="summary-line">结论：行业将迎来新一轮变革浪潮</div>
        <div class="summary-tag-row">
          <div class="summary-mini-tag">简短</div>
          <div class="summary-mini-tag">详细</div>
          <div class="summary-mini-tag">要点</div>
          <div class="summary-mini-tag">时间线</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Features -->
  <div class="features">
    <div class="feature-tag"><span class="tag-icon">⚡</span> 4种摘要模式</div>
    <div class="feature-tag"><span class="tag-icon">🇨🇳</span> 国内免费模型</div>
    <div class="feature-tag"><span class="tag-icon">🌐</span> 6种语言翻译</div>
    <div class="feature-tag"><span class="tag-icon">⌨️</span> 快捷键操作</div>
    <div class="feature-tag"><span class="tag-icon">📄</span> 导出 Markdown</div>
  </div>
</div>
</body>
</html>
